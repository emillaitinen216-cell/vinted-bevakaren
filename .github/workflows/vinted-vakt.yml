# Vakten: startar boten igen om kedjan har stannat.
#
# Varje körning av Vinted-bevakaren startar själv nästa. Någon enstaka gång kommer en
# körning aldrig igång hos GitHub, och då startas ingen ny. Vakten tittar var 30:e
# minut: körs ingen bevakare och väntar ingen på att starta, startar vakten en.
# (Den körs på schema, eftersom GitHub inte startar vakten när en körning som boten
# själv startat blir klar.)
name: Vinted-vakten

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # för att se körningarna och starta en ny

concurrency:
  group: vinted-vakten
  cancel-in-progress: false

jobs:
  starta-om:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Starta boten igen om ingen körning är igång
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow vinted-bot.yml --limit 10 \
              --json status --jq '[.[] | select(.status != "completed")] | length'
          }
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vinted-bot.yml" --jq .state) || {
            echo "Kunde inte läsa läget – försöker igen nästa halvtimme."; exit 0; }
          if [ "$state" != "active" ]; then
            echo "Workflowet är avstängt ($state) – startar ingen ny körning."
            exit 0
          fi
          # Kolla två gånger med en minuts mellanrum, så att ett byte mellan två
          # körningar inte ser ut som att kedjan har stannat.
          for check in 1 2; do
            n=$(active) || { echo "Kunde inte läsa körningarna – försöker igen nästa halvtimme."; exit 0; }
            if [ "$n" -gt 0 ]; then
              echo "Boten är igång – kedjan lever."
              exit 0
            fi
            if [ "$check" = 1 ]; then sleep 60; fi
          done
          echo "Ingen körning är igång – startar boten igen."
          for try in $(seq 1 6); do
            gh workflow run vinted-bot.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}" && exit 0
            sleep 30
          done
          echo "::error::Kunde inte starta boten igen. Tryck Run workflow under fliken Actions."
          exit 1
