# Vakten: startar boten igen om kedjan har stannat.
#
# Varje körning av Vinted-bevakaren startar själv nästa. Någon enstaka gång kommer en
# körning aldrig igång hos GitHub (den misslyckas direkt, utan att något steg körs), och
# då startas ingen ny. Vakten körs varje gång en körning är klar: har den misslyckats och
# ingen ny körning väntar, startar vakten en.
name: Vinted-vakten

on:
  workflow_run:
    workflows: [Vinted-bevakaren]
    types: [completed]

permissions:
  contents: read
  actions: write # för att se körningarna och starta en ny

jobs:
  starta-om:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Starta boten igen om ingen körning väntar
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # En körning som misslyckats på vanligt sätt har redan startat nästa – vänta in den.
          sleep 45
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vinted-bot.yml" --jq .state || echo okänt)
          if [ "$state" != "active" ] && [ "$state" != "okänt" ]; then
            echo "Workflowet är avstängt ($state) – startar ingen ny körning."
            exit 0
          fi
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow vinted-bot.yml --limit 5 \
                      --json status --jq '[.[] | select(.status != "completed")] | length' || echo 0)
          if [ "$waiting" -gt 0 ]; then
            echo "Nästa körning är redan på väg – kedjan lever."
            exit 0
          fi
          for try in $(seq 1 6); do
            gh workflow run vinted-bot.yml --repo "$GITHUB_REPOSITORY" --ref "${BRANCH:-main}" && exit 0
            sleep 30
          done
          echo "::error::Kunde inte starta boten igen. Tryck Run workflow under fliken Actions."
          exit 1
