# Vinted-bevakaren – inställningar
#
# Alla belopp är i kronor (SEK). "resale" (vad du räknar med att kunna sälja
# plagget för) är satt strax under medianen av annonspriserna på vinted.se
# i oktober 2026. Priserna rör sig – kör då och då
#   python vinted_bot.py --kalibrera
# och justera efter din egen erfarenhet av vad som faktiskt säljer.
#
# Så räknas vinsten:
#   säljvärde = resale × skickfaktor + plus för nyckelord (t.ex. "selvage")
#   kostnad   = pris inkl. Vinteds köparskydd + shipping_estimate
#   vinst     = säljvärde × (1 − sell_fee_percent/100) − kostnad
# Du får en notis när vinst ≥ min_profit (och ROI ≥ min_roi_percent).

domain: vinted.se
currency: SEK

interval_seconds: 240           # tid mellan varven (± 20 % slump)
delay_between_searches: [3, 7]  # sekunder mellan sökningarna i ett varv
max_pages: 3                    # bläddra max så här långt om allt på sidan 1 var nytt

# Första gången en sökning körs sparas befintliga annonser utan notis,
# så att du inte får hundra notiser direkt. Sätt true för att få dem ändå.
notify_on_first_run: false

shipping_estimate: 49           # frakten du betalar som köpare
sell_fee_percent: 0             # Vinted tar ingen säljavgift. Tradera m.fl.: sätt t.ex. 10
min_profit: 85                  # standard om en sökning inte anger eget
min_roi_percent: 25             # minsta avkastning på insatsen

# Säljvärdet multipliceras med skickfaktorn (resale anges för "Mycket bra").
condition_multipliers:
  Ny med prislapp: 1.25
  Ny utan prislapp: 1.1
  Mycket bra: 1.0
  Bra: 0.85
  Tillfredsställande: 0.6

# Annonser vars titel innehåller något av de här orden hoppas över.
# (Undvik ord som "fläck" eller "hål" – många skriver "inga fläckar eller hål".)
exclude_keywords:
  - replica
  - fake
  - kopia
  - dupe
  - inspired
  - inspirerad
  - look alike
  - "1:1"
  - söker        # "Söker Moncler …"-annonser
  - wtb
  - defekt       # trasiga plagg (men inte "defekter", som i "inga defekter")
  # Barnplagg som hamnat bland herrkläderna (svenska, engelska, polska, tyska, franska)
  - barn
  - barnjacka
  - kid
  - kids
  - junior
  - girls
  - boys
  - dziecięca
  - dziecięcy
  - dziecięce
  - chłopięca      # polska: pojk-
  - chłopięcy
  - chłopięce
  - dziewczęca     # polska: flick-
  - dziewczęcy
  - dziewczęce
  - kinder
  - enfant

# Fraser som innehåller ett exclude-ord men är vanliga herrplagg – de räknas inte.
exclude_exceptions:
  - barn coat       # Carhartt
  - barn jacket     # Ralph Lauren m.fl.
  - kid mohair
  - kid suede
  - kid leather

# Damplagg som hamnat bland herrkläderna hoppas över – utom när titeln också
# säger att plagget passar herrar ("herr/dam", "unisex", "homme femme").
womens_keywords:
  - dam
  - damjacka
  - dames
  - damska
  - damski
  - damskie
  - damen
  - femme
  - women
  - womens
  - woman
  - ladies
unisex_keywords:
  - unisex
  - herr
  - herrar
  - herren
  - homme
  - mens
  - for men
  - męska
  - męski
  - męskie
  - heren
  - uniseks
  - mixte
  - men/women
  - women/men
  - men women
  - women men
  - men & women
  - women & men
  - men and women
  - women and men

# Ord i titeln som höjer (eller med minus sänker) säljvärdet, i kronor.
premium_keywords:
  made in italy: 100
  made in usa: 100
  made in japan: 150
  deadstock: 150

# Valfritt: notiskanaler. Lägg hellre hemligheterna i filen .env
# (se .env.example) så hamnar de inte i git.
notify:
  telegram:
    bot_token: ""
    chat_id: ""
  discord_webhook: ""
  ntfy_topic: ""
  ntfy_server: https://ntfy.sh

# Ämnen i Telegram-gruppen (slå på "Ämnen" i gruppens inställningar och ge boten
# admin-rätten "Hantera ämnen"). Boten skapar ämnena själv och lägger varje fynd i
# ämnet som matchar sökningens taggar. Utan Ämnen hamnar allt i gruppen som vanligt.
topics:
  Dunjackor: [Dunjacka]
  Jackor: [Jacka, Fältjacka]
  Jeans: [Jeans, Bootcut]
  Tröjor & skjortor: [Tröja, Skjorta, Hoodie]

# "Dagens 5 bästa fynd" (som inte hunnit säljas) skickas en gång om dagen efter den
# här timmen, svensk tid, i ett eget ämne. false = ingen sammanfattning.
daily_summary_hour: 20
summary_topic: "⭐ Dagens bästa"

# På söndagar skickas också en veckorapport i samma ämne (antal fynd, hur snabbt de
# såldes, bästa märket). false = ingen veckorapport.
weekly_report: true

# Flikarna "👋 Välkommen" och "📖 Start här": boten skriver en välkomsttext och en guide
# till gruppen (med märkeslistan), fäster dem och låser flikarna. Texterna uppdateras av sig
# själva när märkena ändras. false = inga infoflikar.
info_topics: true

# Öppen flik där medlemmarna kan prata, fråga om äkthet och sälja till varandra. false = ingen.
chat_topic: "💬 Snack"

# Låst flik där boten varje dag visar vilka märken bland fynden som säljs snabbast, mest
# och med störst vinst (senaste 30 dagarna). false = ingen statistikflik.
stats_topic: "📊 Statistik"

# Öppen flik där man skriver ett plagg (t.ex. Moncler Maya) och får vad det kostar på Vinted
# just nu – samma svar som /pris, utan kommando. false = ingen prischeck-flik.
price_topic: "💰 Prischeck"

# Låst flik med hur man bevakar vilka plagg som helst och tips för att köpa och sälja vidare
# (köp rätt, sälj bra, säsong, vad man ska undvika, skatt). false = ingen guide-flik.
resell_topic: "📈 Resell Guide"

# Öppen flik där medlemmarna visar sina vinster. När någon skriver /sald med vinst
# (var som helst i gruppen) skriver boten också en rad här. false = ingen vinst-flik.
wins_topic: "🏆 Vinster"

# Tar bort inlägg (i gruppen och privat) med fynd i märken som tagits bort härifrån.
# Telegram låter bara boten ta bort inlägg som är högst 48 timmar gamla. false = behåll dem.
remove_unwatched_deals: true

# Privat larm till dig (ägaren) när boten har stått still i mer än 40 minuter, när Vinted
# spärrat den tre varv i rad, eller när inga fynd kommit på 12 timmar. false = inga larm.
owner_alarms: true

# Ansökan med betalning: /lank (privat till boten) ger en ansökningslänk, /betalinfo sätter
# vad man ska betala. Den som ansöker skickar en skärmdump på betalningen till boten, och du
# får den med knapparna ✅ Släpp in och ❌ Neka. false = boten bryr sig inte om ansökningar.
join_requests: true

# Fynd-flikarna är bara för fynd: det medlemmar skriver där tas bort (admins undantagna, och
# svar på ett fynd med /legit eller /sald). Kommandon besvaras i General i stället, och den som
# chattat får en vänlig hänvisning i Snack. Kräver att boten får ta bort meddelanden. false = av.
clean_deal_topics: true

# Tyst natt: fynd mellan de här timmarna (svensk tid) kommer utan ljud. false = av.
quiet_hours: [23, 7]

# Kopierisk i varje fynd: boten öppnar annonsen och kollar säljarens omdömen, bilderna
# och orden i annonsen. Redan sålda annonser skickas inte. false = av.
deal_risk: true

# Självjustering: en gång per dygn tittar boten på hur varje sökings fynd sålts de senaste
# två veckorna. Blir fynden liggande höjs vinstgränsen 10 %, säljs allt på minuter sänks den
# 5 %. Den hålls mellan 80 och 150 % av min_profit nedan. false = bara min_profit gäller.
auto_tune: true

# --------------------------------------------------------------------------
# Sökningar
#
#   name          visas i notisen (måste vara unikt)
#   query         söktext på Vinted (tom = hela kategorin)
#   catalog       Vinteds kategori-id:n, se README.md
#   max_price     högsta pris (säljarens pris, före köparskydd)
#   brands        märke: säljvärde   – eller  märke: {resale, max_price, suspicious_below}
#                 (även min_price går att sätta per märke)
#                 Bara listade märken bevakas, om inte "resale" anges för övriga.
#   resale        säljvärde för märken som inte står i brands (valfritt)
#   min_price     lägsta pris – billigare annonser hoppas över helt (valfritt)
#   min_profit    minsta uppskattade vinst för notis
#   suspicious_below  pris under detta flaggas "kolla äkthet" (vanligt med kopior)
#   sizes         t.ex. [W32, W33, M] – bara dessa storlekar (valfritt)
#   premium_keywords / exclude_keywords  läggs till de globala listorna
#   tags          hashtaggar i notisen, t.ex. [Jeans] → #Jeans (märket blir alltid en hashtagg).
#                 Tryck på en hashtagg i Telegram för att se alla notiser med den.
#   enabled       false = pausa sökningen
#   hot           true = toppmärke som söks oftare: två gånger per varv, och igen i tiden som blir över
# --------------------------------------------------------------------------

searches:

  # "max_price" är ett tak för vad som hämtas; det är "min_profit" som avgör
  # vad som blir notis. Ett plagg med bonusord (t.ex. "zatiny") kan därför vara
  # lönsamt nära taket medan ett vanligt behöver vara betydligt billigare.
  #
  # "min_profit" sattes först så att varje sökning gav högst ungefär två notiser per
  # dygn (uppmätt på vinted.se i oktober 2026) och sänktes sedan 15 % för fler fynd.
  # Populära märken som Ralph Lauren och Supreme har så många billiga annonser
  # att i stort sett bara plagg med bonusord (t.ex. "polo bear", "box logo")
  # räcker. Vill du ha fler notiser sänker du min_profit, färre höjer du den.

