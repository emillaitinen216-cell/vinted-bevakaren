# Vinted-bevakaren – inställningar
#
# Alla belopp är i kronor (SEK). "resale" (vad du räknar med att kunna sälja
# plagget för) är satt strax under medianen av annonspriserna på vinted.se
# i oktober 2026. Priserna rör sig – kör då och då
#   python vinted_bot.py --kalibrera
# och justera efter din egen erfarenhet av vad som faktiskt säljer.
#
# Så räknas vinsten:
#   säljvärde = resale × skickfaktor + plus för nyckelord (t.ex. "selvage")
#   kostnad   = pris inkl. Vinteds köparskydd + shipping_estimate
#   vinst     = säljvärde × (1 − sell_fee_percent/100) − kostnad
# Du får en notis när vinst ≥ min_profit (och ROI ≥ min_roi_percent).

domain: vinted.se
currency: SEK

interval_seconds: 240           # tid mellan varven (± 20 % slump)
delay_between_searches: [3, 7]  # sekunder mellan sökningarna i ett varv
max_pages: 3                    # bläddra max så här långt om allt på sidan 1 var nytt

# Första gången en sökning körs sparas befintliga annonser utan notis,
# så att du inte får hundra notiser direkt. Sätt true för att få dem ändå.
notify_on_first_run: false

shipping_estimate: 49           # frakten du betalar som köpare
sell_fee_percent: 0             # Vinted tar ingen säljavgift. Tradera m.fl.: sätt t.ex. 10
min_profit: 100                 # standard om en sökning inte anger eget
min_roi_percent: 30             # minsta avkastning på insatsen

# Säljvärdet multipliceras med skickfaktorn (resale anges för "Mycket bra").
condition_multipliers:
  Ny med prislapp: 1.25
  Ny utan prislapp: 1.1
  Mycket bra: 1.0
  Bra: 0.85
  Tillfredsställande: 0.6

# Annonser vars titel innehåller något av de här orden hoppas över.
# (Undvik ord som "fläck" eller "hål" – många skriver "inga fläckar eller hål".)
exclude_keywords:
  - replica
  - fake
  - kopia
  - dupe
  - inspired
  - inspirerad
  - look alike
  - "1:1"
  - söker        # "Söker Moncler …"-annonser
  - wtb
  - defekt       # trasiga plagg (men inte "defekter", som i "inga defekter")
  # Dam- och barnplagg som hamnat bland herrkläderna (svenska, engelska, polska, tyska, franska)
  - dam
  - dames
  - damska
  - damski
  - damskie
  - damen
  - femme
  - women
  - womens
  - woman
  - ladies
  - barn
  - kids
  - kid
  - junior
  - girls
  - boys
  - dziecięca
  - dziecięcy
  - kinder
  - enfant
  - damjacka
  - barnjacka

# Ord i titeln som höjer (eller med minus sänker) säljvärdet, i kronor.
premium_keywords:
  made in italy: 100
  made in usa: 100
  made in japan: 150
  deadstock: 150

# Valfritt: notiskanaler. Lägg hellre hemligheterna i filen .env
# (se .env.example) så hamnar de inte i git.
notify:
  telegram:
    bot_token: ""
    chat_id: ""
  discord_webhook: ""
  ntfy_topic: ""
  ntfy_server: https://ntfy.sh

# Ämnen i Telegram-gruppen (slå på "Ämnen" i gruppens inställningar och ge boten
# admin-rätten "Hantera ämnen"). Boten skapar ämnena själv och lägger varje fynd i
# ämnet som matchar sökningens taggar. Utan Ämnen hamnar allt i gruppen som vanligt.
topics:
  Dunjackor: [Dunjacka]
  Jackor: [Jacka, Fältjacka]
  Jeans: [Jeans, Bootcut]
  Tröjor & skjortor: [Tröja, Skjorta, Hoodie]
  Byxor & shorts: [Byxor, Shorts, Mjukisbyxor]

# "Dagens 5 bästa fynd" (som inte hunnit säljas) skickas en gång om dagen efter den
# här timmen, svensk tid, i ett eget ämne. false = ingen sammanfattning.
daily_summary_hour: 20
summary_topic: "⭐ Dagens bästa"

# --------------------------------------------------------------------------
# Sökningar
#
#   name          visas i notisen (måste vara unikt)
#   query         söktext på Vinted (tom = hela kategorin)
#   catalog       Vinteds kategori-id:n, se README.md
#   max_price     högsta pris (säljarens pris, före köparskydd)
#   brands        märke: säljvärde   – eller  märke: {resale, max_price, suspicious_below}
#                 (även min_price går att sätta per märke)
#                 Bara listade märken bevakas, om inte "resale" anges för övriga.
#   resale        säljvärde för märken som inte står i brands (valfritt)
#   min_price     lägsta pris – billigare annonser hoppas över helt (valfritt)
#   min_profit    minsta uppskattade vinst för notis
#   suspicious_below  pris under detta flaggas "kolla äkthet" (vanligt med kopior)
#   sizes         t.ex. [W32, W33, M] – bara dessa storlekar (valfritt)
#   premium_keywords / exclude_keywords  läggs till de globala listorna
#   tags          hashtaggar i notisen, t.ex. [Jeans] → #Jeans (märket blir alltid en hashtagg).
#                 Tryck på en hashtagg i Telegram för att se alla notiser med den.
#   enabled       false = pausa sökningen
# --------------------------------------------------------------------------

searches:

  # "max_price" är ett tak för vad som hämtas; det är "min_profit" som avgör
  # vad som blir notis. Ett plagg med bonusord (t.ex. "zatiny") kan därför vara
  # lönsamt nära taket medan ett vanligt behöver vara betydligt billigare.
  #
  # "min_profit" är satt så att varje sökning ger högst ungefär två notiser per
  # dygn (uppmätt på vinted.se i oktober 2026), alltså bara de bästa fynden.
  # Populära märken som Ralph Lauren och Supreme har så många billiga annonser
  # att i stort sett bara plagg med bonusord (t.ex. "polo bear", "box logo")
  # räcker. Vill du ha fler notiser sänker du min_profit, färre höjer du den.

